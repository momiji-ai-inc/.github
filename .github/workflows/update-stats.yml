name: Update commit stats

on:
  schedule:
    # Daily at 00:15 UTC (≈ 09:15 JST)
    - cron: "15 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/aggregate.py"
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVG
        env:
          ORG: ${{ github.repository_owner }}
          # ORG_STATS_TOKEN must be a fine-grained PAT with
          # "Metadata: Read" and "Contents: Read" on all org repos.
          GH_TOKEN: ${{ secrets.ORG_STATS_TOKEN }}
          OUTPUT: assets/commits.svg
        run: python scripts/aggregate.py

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- assets/commits.svg; then
            echo "No changes."
            exit 0
          fi
          git add assets/commits.svg
          git commit -m "chore: update commit stats ($(date -u +%Y-%m-%d))"
          git push
